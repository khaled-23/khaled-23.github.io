<header class="page header">
  <a class="brand" routerLink="/">{{ name }}</a>

  <nav aria-label="Main">
    <ul class="menu" role="list">
      @for (item of items; track item.path) {
        <li>
          <a [routerLink]="item.path" routerLinkActive="is-active" ariaCurrentWhenActive="page">
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </nav>
</header>
